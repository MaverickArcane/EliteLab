name: CI

on:
  push:
    branches: [ main, master, development, feat/hauling-desk-v2 ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos-package:
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build native menu bar and checksum-pinned Python package
        run: python scripts/build_macos.py
      - name: Install, exercise native controls, upgrade and remove
        run: python scripts/smoke_macos.py dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.pkg.sha256
          if-no-files-found: error

  macos-source-setup:
    name: macOS source setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extracted source setup and restart
        run: |
          python -m unittest discover -s tests -p test_source_setup.py -v
          python -m unittest discover -s tests -p test_restart.py -v

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, fixture journal)
        run: python -m unittest discover -s tests -v
      - name: Module manifest check
        run: python -m elitelab modules

  frontend:
    name: Front-end syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every script
        run: |
          set -e
          for f in web/*.js modules/*/web/*.js; do node --input-type=module --check < "$f"; done
      - name: Individual profit estimates
        run: node tests/profits.mjs
      - name: State stream ordering and recovery
        run: node tests/state-feed.mjs

  browser:
    name: Owner and crew browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Headless Chrome session
        run: node tests/browser.mjs
      - name: Changed-port setup restart under CSP
        run: node tests/restart-browser.mjs
      - name: Mining journal session and responsive card
        env:
          ELITELAB_SCREENSHOT_DIR: mining-screenshots
        run: node tests/mining-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-browser-screenshots
          path: mining-screenshots/
          if-no-files-found: ignore

      - name: Rare buying workflow and market evidence
        env:
          ELITELAB_SCREENSHOT_DIR: rares-screenshots
        run: node tests/rares-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rares-browser-screenshots
          path: rares-screenshots/
          if-no-files-found: ignore

      - name: Trade route to Powerplay finder handoff
        env:
          ELITELAB_SCREENSHOT_DIR: trade-powerplay-screenshots
        run: node tests/trade-powerplay-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-powerplay-screenshots
          path: trade-powerplay-screenshots/
          if-no-files-found: ignore

      - name: Indexed journal history and responsive card
        env:
          ELITELAB_SCREENSHOT_DIR: history-screenshots
        run: node tests/history-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-browser-screenshots
          path: history-screenshots/
          if-no-files-found: ignore

      - name: Rare sell targets and merit forecasts
        env:
          ELITELAB_SCREENSHOT_DIR: targets-screenshots
        run: node tests/targets-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targets-browser-screenshots
          path: targets-screenshots/
          if-no-files-found: ignore

      - name: Unified materials and recipes workflow
        env:
          ELITELAB_SCREENSHOT_DIR: material-plan-screenshots
        run: node tests/material-plan-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-plan-browser-screenshots
          path: material-plan-screenshots/
          if-no-files-found: ignore

  windows-bundle:
    name: Portable Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build with checksum-verified embedded Python
        run: python scripts/build_windows.py
      - name: Launch extracted bundle without system Python on PATH
        run: python scripts/smoke_windows_bundle.py
      - name: Build and test Windows installer
        shell: pwsh
        run: |
          $taskCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $taskCompiler)) { throw 'Inno Setup 6 compiler not found' }
          python scripts/build_windows_installer.py --compiler $taskCompiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskId = 'EliteLab.Installer.Test.' + [guid]::NewGuid().ToString('N')
          python scripts/build_windows_installer.py --compiler $taskCompiler --output dist/EliteLab-Setup-test.exe --app-id $taskId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_windows_installer.py dist/EliteLab-Setup-test.exe --test-id-confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-Windows-installer
          path: |
            dist/EliteLab-Setup-x64.exe
            dist/EliteLab-Setup-x64.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-windows-x64
          path: |
            dist/EliteLab-windows-x64.zip
            dist/EliteLab-windows-x64.zip.sha256
          if-no-files-found: error

  debian-package:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise extracted package
        run: |
          python3 scripts/build_debian.py
          python3 scripts/smoke_debian.py dist/*.deb
      - name: Install, upgrade and uninstall while preserving user data
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          python3 scripts/smoke_debian.py dist/*.deb --installed-ci
      - name: Native Linux desktop controls under Xvfb
        run: |
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb xauth
          dpkg-deb -x dist/*.deb dist/linux-desktop-test
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 scripts/smoke_linux_desktop.py dist/linux-desktop-test/usr/lib/elitelab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-desktop-screenshots
          path: linux-desktop-screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-debian
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t elitelab:ci .
      - name: Smoke test against the fixture journal
        run: |
          docker run -d --name lab -p 8766:8766 -v "$PWD/tests/fixtures/journals:/journals:ro" -e ELITELAB_OFFLINE=1 elitelab:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8766/api/health && break; sleep 1; done
          python3 - <<'PY'
          import json, time, urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://localhost:8766/api/journal', timeout=2) as response:
                      journal = json.load(response)
                  if journal.get('cmdr') == 'Testpilot':
                      print('ok', journal['ship'])
                      break
              except OSError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit('Fixture replay did not finish')
          PY
          docker rm -f lab

  expedition-browser:
    name: Expedition browser and security UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Desktop and mobile browser checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ELITELAB_SCREENSHOT_DIR: expedition-screenshots
        run: node tests/expedition-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-browser-screenshots
          path: expedition-screenshots/
          if-no-files-found: ignore
