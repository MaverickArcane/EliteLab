name: CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, fixture journal)
        run: python -m unittest discover -s tests -v
      - name: Module manifest check
        run: python -m elitelab modules

  frontend:
    name: Front-end syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every script
        run: |
          set -e
          for f in web/*.js modules/*/web/*.js; do node --check "$f"; done

  windows-bundle:
    name: Portable Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build with checksum-verified embedded Python
        run: python scripts/build_windows.py
      - name: Launch extracted bundle without system Python on PATH
        run: python scripts/smoke_windows_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: EliteLab-windows-x64
          path: |
            dist/EliteLab-windows-x64.zip
            dist/EliteLab-windows-x64.zip.sha256
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t elitelab:ci .
      - name: Smoke test against the fixture journal
        run: |
          docker run -d --name lab -p 8766:8766 -v "$PWD/tests/fixtures/journals:/journals:ro" -e ELITELAB_OFFLINE=1 elitelab:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8766/api/health && break; sleep 1; done
          curl -fs http://localhost:8766/api/journal | python3 -c "import sys,json; j=json.load(sys.stdin); assert j['cmdr']=='Testpilot', j; print('ok', j['ship'])"
          docker rm -f lab
