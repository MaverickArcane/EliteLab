name: Beta release

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate beta identity and staging ancestry
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          from elitelab import __version__
          if not re.fullmatch(r'\d+\.\d+\.\d+-beta\.[1-9]\d*', __version__):
              raise SystemExit('Expected a numbered beta application version')
          if os.environ['RELEASE_REF'] != 'refs/tags/v' + __version__:
              raise SystemExit('Run this workflow on the matching beta tag')
          if not (Path('docs/releases') / (__version__ + '.md')).is_file():
              raise SystemExit('Missing beta release notes')
          PY
          git merge-base --is-ancestor HEAD origin/staging
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: EliteLab-*
          merge-multiple: true
          path: dist
      - name: Verify complete packages and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/prepare_beta.py dist "$RELEASE_TAG"
          git archive --format=tar.gz --prefix=EliteLab/ --output="dist/EliteLab-${RELEASE_TAG}-source.tar.gz" HEAD
          cd dist
          sha256sum "EliteLab-${RELEASE_TAG}-source.tar.gz" > "EliteLab-${RELEASE_TAG}-source.tar.gz.sha256"
          sha256sum --check --strict *.sha256
          cat *.sha256 > SHA256SUMS.txt
      - name: Publish verified beta (never the latest stable release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --latest=false \
            --title "EliteLab ${version/-beta./ Beta }" --notes-file "docs/releases/$version.md"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
